version: '3.8'
services:
  mymongo:
    image: "mongo:5.0"
    ports:
      - "30023:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "vulkan"
    volumes:
      - mymongodata:/data/db
  mfrabbitmq:
    image: rabbitmq:3.10.5-management
    ports:
      - "30021:5672"
      - "30022:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "user"
      RABBITMQ_DEFAULT_PASS: "vulkan"
    volumes:
      - mfrabbitmqdata:/var/lib/rabbitmq
  keycloak:
    image: keycloak/keycloak:21.1.2
    ports:
      - "30024:8080"
    volumes:
      - keycloakdata:/conf
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
    command: ["start-dev"]
volumes:
  mymongodata:
    driver: local
  mfrabbitmqdata:
    driver: local
  keycloakdata:
    driver: local
